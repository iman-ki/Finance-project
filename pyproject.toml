[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrp"
version = "0.1.0"
description = "Modular Quantitative Research Platform: data, signals, backtesting, risk and reporting as independent plugins."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "matplotlib",
    "pyyaml",
    "streamlit",  # the interactive app (python -m qrp app)
    "yfinance",  # prototyping data source; replace via data.provider when a better API is available
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyterlab"]

[tool.hatch.build.targets.wheel]
packages = ["src/qrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
